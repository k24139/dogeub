services:
  - type: web
    name: nutub-private-browser
    plan: free
    branch: cleanup/sites-deployment
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: PROXY_PASSWORD
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://dogeub.basicpuppy5.chatgpt.site
